---
- name: Record that Java health verification was skipped
  ansible.builtin.set_fact:
    java_healthcheck_status: healthcheck_skipped
  when: not java_healthcheck_enabled | bool
  # noqa: var-naming[no-role-prefix]

- name: Verify Java application health endpoint
  when: java_healthcheck_enabled | bool
  block:
    - name: Request Java application health endpoint
      ansible.builtin.uri:
        url: "{{ java_healthcheck_url }}"
        method: GET
        status_code: "{{ java_expected_status }}"
        timeout: "{{ java_healthcheck_timeout }}"
        return_content: false
        validate_certs: true
      register: healthcheck_response
      until: healthcheck_response.status | default(0) | int == java_expected_status | int
      retries: "{{ java_healthcheck_retries }}"
      delay: "{{ java_healthcheck_delay }}"
      no_log: true

    - name: Record successful Java health verification
      ansible.builtin.set_fact:
        java_healthcheck_status: healthy
      # noqa: var-naming[no-role-prefix]

  rescue:
    - name: Report Java health verification failure
      ansible.builtin.fail:
        msg: >-
          Health check failed for {{ java_app_name }} after
          {{ java_healthcheck_retries }} attempts. Verify the service, endpoint,
          and expected HTTP status {{ java_expected_status }}.
