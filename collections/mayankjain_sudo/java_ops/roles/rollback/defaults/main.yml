---
java_operation: rollback # noqa: var-naming[no-role-prefix]
java_artifact_type: jar # noqa: var-naming[no-role-prefix]
java_archive_artifact_path: "{{ java_app_name }}.{{ java_artifact_type }}" # noqa: var-naming[no-role-prefix]
java_releases_dir: "{{ java_base_dir }}/releases" # noqa: var-naming[no-role-prefix]
java_current_path: "{{ java_base_dir }}/current" # noqa: var-naming[no-role-prefix]
java_rollback_target_version: "" # noqa: var-naming[no-role-prefix]
java_run_as_user: root # noqa: var-naming[no-role-prefix]
java_run_as_group: root # noqa: var-naming[no-role-prefix]
java_manage_service: false # noqa: var-naming[no-role-prefix]
java_service_name: "" # noqa: var-naming[no-role-prefix]
java_service_state: restarted # noqa: var-naming[no-role-prefix]
java_healthcheck_enabled: true # noqa: var-naming[no-role-prefix]
java_healthcheck_url: "" # noqa: var-naming[no-role-prefix]
java_expected_status: 200 # noqa: var-naming[no-role-prefix]
java_healthcheck_retries: 10 # noqa: var-naming[no-role-prefix]
java_healthcheck_delay: 3 # noqa: var-naming[no-role-prefix]
java_healthcheck_timeout: 5 # noqa: var-naming[no-role-prefix]
